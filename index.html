<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f94d1">
<title>Roblox Item Tracker</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#241f18;--mu:#7a7060;--bd:#ddd5c4;--ac:#2f94d1;--onac:#fff;--g:#2e9e4f;--y:#e8b923;--r:#d64545;--e:#cfc8b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#231f18;--tx:#f0eadc;--mu:#a09680;--bd:#3a3326;--ac:#6ec1f0;--onac:#0b2433;--e:#3a3326}}
:root[data-theme="dark"]{--bg:#17140f;--card:#231f18;--tx:#f0eadc;--mu:#a09680;--bd:#3a3326;--ac:#6ec1f0;--onac:#0b2433;--e:#3a3326}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
button,select,input{font:inherit;color:inherit}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
.btn.b{background:var(--ac);color:var(--onac)}
.btn.s{background:transparent;color:var(--r);border:1px solid var(--r);margin-top:8px}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:16px;background:var(--e);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.bar i.ok{background:var(--g)}
.big{font-size:26px;font-weight:800}
.mu{color:var(--mu);font-size:13px}
.err{color:var(--r);font-size:14px;margin-top:10px;min-height:20px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.box{aspect-ratio:1;border:0;border-radius:8px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;padding:2px;line-height:1.15}
.box.g{background:var(--g)}.box.y{background:var(--y);color:#222}.box.r{background:var(--r)}
.box.sel{outline:3px solid var(--tx);outline-offset:1px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:10px 0}
.lg b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hide{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.hide{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#auth{max-width:420px;margin:8vh auto 0}
</style>
</head>
<body>
<div class="w">

<div id="auth" class="hide">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h1>🎮 Roblox Item Tracker</h1><button class="ic" id="th0">🌓</button></div>
  <div class="card">
    <b>Log in</b>
    <label for="un">Username</label><input id="un" autocomplete="username" autocapitalize="none" placeholder="3-20 letters/numbers">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="aerr"></div>
    <button class="btn b" id="login">Log in</button>
    <div class="mu" style="margin-top:12px">Accounts are private. Ask the owner if you need one.</div>
  </div>
</div>

<div id="modal" class="modal hide"><div class="card" style="width:100%;max-width:380px;margin:0">
<b>Add a game</b>
<label for="gname">Game name</label><input id="gname" maxlength="40" placeholder="e.g. Blox Fruits" autocomplete="off">
<label for="gq">Daily quota (e.g. 50k)</label><input id="gq" placeholder="50k" autocomplete="off">
<div class="err" id="gerr"></div>
<button class="btn b" id="gok">Add game</button><button class="btn o" id="gcancel">Cancel</button>
</div></div>
<div id="app" class="hide">
<header><h1>🎮 Roblox Item Tracker</h1><div><button class="ic" id="th">🌓</button> <button class="ic" id="out">Log out</button></div></header>
<div class="mu" style="margin:-6px 0 10px"><span id="who"></span> · <span id="sync"></span></div>
<div class="card" style="display:flex;gap:8px;align-items:center;padding:10px"><select id="game" aria-label="Game" style="flex:1"></select><button class="ic" id="addgame" style="white-space:nowrap">+ Add more</button></div>
<div class="tabs"><button id="t1" class="on">Sell</button><button id="t2">Track</button></div>

<div id="p1">
<div class="card">
<label for="dt">Day</label><input type="date" id="dt">
<div style="margin-top:12px"><span class="big" id="tot">0</span> <span class="mu">/ <span id="qv">50,000</span> quota</span></div>
<div class="bar"><i id="pb"></i></div>
<div class="mu" id="msg"></div>
</div>
<div class="card">
<label for="axe">Item</label>
<select id="axe"></select>
<div style="display:flex;gap:8px;margin-top:8px"><input id="newitem" maxlength="30" placeholder="New item, e.g. Pig Axe" autocomplete="off"><button class="ic" id="additem" style="white-space:nowrap">Add</button></div>
<div class="mu" id="itemmsg" style="margin-top:6px"></div>
<a href="#" id="delitem" style="color:var(--r);font-size:13px">Remove selected item from list</a>
<label for="pr">Price (e.g. 15000 or 15k)</label>
<input id="pr" inputmode="text" placeholder="15k" autocomplete="off">
<button class="btn" id="sell">Item sold</button>
<button class="btn s" id="give">Give up for the day</button>
</div>
<div class="card"><b>Sales this day</b><div id="log"></div></div>
<div class="card">
<label for="qin">Daily quota (applies to this day and future days)</label>
<input id="qin" inputmode="text" placeholder="50k">
<button class="btn b" id="qsave">Save quota</button>
</div>
</div>

<div id="p2" class="hide">
<div class="card stats">
<div><div class="mu">Lifetime sold</div><div class="big" id="life">0</div></div>
<div><div class="mu">Items sold</div><div class="big" id="cnt">0</div></div>
<div><div class="mu">Quotas hit</div><div class="big" id="hit">0</div></div>
<div><div class="mu">Days tracked</div><div class="big" id="dd">0</div></div>
</div>
<div class="card">
<div class="lg"><span><b style="background:var(--g)"></b>Quota hit</span><span><b style="background:var(--y)"></b>Not hit</span><span><b style="background:var(--r)"></b>No sales</span></div>
<div class="grid" id="grid"></div>
</div>
<div class="card hide" id="det"></div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* ====== PASTE YOUR FIREBASE CONFIG HERE ====== */
const firebaseConfig={
  apiKey:"AIzaSyB62H_J0AslaeX86EF9U1cZ26Xd5j7j9TI",
  authDomain:"axelumbertracker.firebaseapp.com",
  projectId:"axelumbertracker",
  appId:"1:664828393285:web:c126dbb98bdc760837302c"
};
/* ============================================= */

const $=id=>document.getElementById(id);
const configured=!String(firebaseConfig.apiKey).startsWith('PASTE');
let G=null,S={theme:null,games:{},cur:null},uid=null,uname='',db=null,auth=null,tmr=null;
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nice=k=>{const[a,b,c]=k.split('-');return c+'/'+b+'/'+a};
const f=n=>n.toLocaleString('en-US');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const sum=d=>d.sales.reduce((a,s)=>a+s.price,0);
const qOf=d=>d.q||G.quota||50000;
const get=k=>G.days[k]||{sales:[],gaveUp:null};
function dur(ms){const m=Math.round(ms/60000);if(m<1)return'under 1 min';const h=Math.floor(m/60);return h?h+'h '+(m%60)+'m':m+' min'}
function hitInfo(d){let c=0;const q=qOf(d);for(const s of d.sales){c+=s.price;if(c>=q)return{t:s.t,took:s.t-d.sales[0].t}}return null}
function parse(v){const m=v.trim().replace(/,/g,'').match(/^(\d*\.?\d+)\s*([km])?$/i);if(!m)return NaN;let n=parseFloat(m[1]);const u=(m[2]||'').toLowerCase();if(u==='k')n*=1e3;if(u==='m')n*=1e6;return Math.round(n)}

/* theme (remembered on this device and in your account) */
try{const t=localStorage.getItem('lt2_theme');if(t)S.theme=t}catch(e){}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme:dark)').matches);S.theme=dark?'light':'dark';try{localStorage.setItem('lt2_theme',S.theme)}catch(e){}applyTheme();if(uid)save()}
$('th').onclick=$('th0').onclick=toggleTheme;
applyTheme();

/* saving: device cache + Firebase */
function setSync(t){$('sync').textContent=t}
function save(){
  try{localStorage.setItem('lt2_'+uid,JSON.stringify({u:Date.now(),S}))}catch(e){}
  setSync('saving…');clearTimeout(tmr);
  tmr=setTimeout(()=>{db.collection('users').doc(uid).set({json:JSON.stringify(S),u:Date.now()}).then(()=>setSync('☁️ synced')).catch(()=>setSync('⚠️ offline, will retry on next change'))},500);
}

/* auth */
const toEmail=u=>u.toLowerCase()+'@lt2tracker.app';
function msg(e){const c=e&&e.code||'';
  if(c.includes('email-already-in-use'))return'That username is taken.';
  if(c.includes('weak-password'))return'Password must be at least 6 characters.';
  if(c.includes('invalid-credential')||c.includes('user-not-found')||c.includes('wrong-password'))return'Wrong username or password.';
  if(c.includes('operation-not-allowed'))return'Enable Email/Password sign-in in Firebase first.';
  if(c.includes('network'))return'No internet connection.';
  return'Error: '+(c||e);}
function creds(){const u=$('un').value.trim(),p=$('pw').value;
  if(!/^[a-z0-9_.-]{3,20}$/i.test(u)){$('aerr').textContent='Username: 3-20 letters, numbers, _ . -';return null}
  if(!p){$('aerr').textContent='Enter a password.';return null}
  $('aerr').textContent='';return{u,p}}
if(!configured){$('auth').classList.remove('hide');$('aerr').textContent='Firebase is not set up yet: paste your firebaseConfig into the file.';$('login').disabled=true}
else{
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
  $('login').onclick=()=>{const c=creds();if(c)auth.signInWithEmailAndPassword(toEmail(c.u),c.p).catch(e=>$('aerr').textContent=msg(e))};
  $('pw').onkeydown=e=>{if(e.key==='Enter')$('login').click()};
  $('out').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(async u=>{
    if(!u){uid=null;$('app').classList.add('hide');$('auth').classList.remove('hide');$('pw').value='';return}
    uid=u.uid;uname=(u.email||'').split('@')[0];
    $('who').textContent='👤 '+uname;$('auth').classList.add('hide');$('app').classList.remove('hide');setSync('loading…');
    let local=null;try{local=JSON.parse(localStorage.getItem('lt2_'+uid))}catch(e){}
    let remote=null,ok=true;
    try{const sn=await db.collection('users').doc(uid).get();if(sn.exists)remote={u:sn.data().u||0,S:JSON.parse(sn.data().json)}}catch(e){ok=false}
    const best=(local&&(!remote||local.u>remote.u))?local:remote;
    const th=S.theme;
    S={theme:th,games:{lt2:{name:'Lumber Tycoon 2',quota:50000,items:[],days:{}}},cur:'lt2'};
    if(best&&best.S){S=best.S;if(!S.theme)S.theme=th}
    migrate();
    applyTheme();renderGames();renderItems('');cur=key(new Date());auto=true;$('dt').value=cur;sel=null;
    renderSell();renderTrack();
    if(!ok)setSync('⚠️ offline');else if(local&&(!remote||local.u>remote.u))save();else setSync('☁️ synced');
  });
}

/* tabs */
function tab(n){$('p1').classList.toggle('hide',n!==1);$('p2').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);if(n===2)renderTrack()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* day + date follows the phone's clock */
let cur=key(new Date()),sel=null,auto=true,armed=0;
$('dt').value=cur;
$('dt').onchange=e=>{cur=e.target.value||key(new Date());auto=(cur===key(new Date()));renderSell()};
function syncDate(){const t=key(new Date());if(uid&&auto&&cur!==t){cur=t;$('dt').value=t;renderSell();if(!$('p2').classList.contains('hide'))renderTrack()}}
setInterval(syncDate,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDate()});
window.addEventListener('focus',syncDate);

function migrate(){
  if(!S.games){ /* old single-game save: move into "Lumber Tycoon 2", keep an untouched backup copy */
    S.backupV1={days:S.days||{},quota:S.quota||50000,items:S.items||[]};
    S.games={lt2:{name:'Lumber Tycoon 2',quota:S.backupV1.quota,items:JSON.parse(JSON.stringify(S.backupV1.items)),days:JSON.parse(JSON.stringify(S.backupV1.days))}};
    S.cur='lt2';delete S.days;delete S.quota;delete S.items;
  }
  if(!S.games[S.cur])S.cur=Object.keys(S.games)[0];
  G=S.games[S.cur];G.days=G.days||{};G.quota=G.quota||50000;G.items=G.items||[];
}
function renderGames(){
  $('game').innerHTML=Object.keys(S.games).map(id=>'<option value="'+id+'">'+esc(S.games[id].name)+'</option>').join('');
  $('game').value=S.cur;
}
function selectGame(id){
  S.cur=id;G=S.games[id];sel=null;$('itemmsg').textContent='';
  renderGames();renderItems('');renderSell();renderTrack();save();
}
$('game').onchange=e=>selectGame(e.target.value);
$('addgame').onclick=()=>{$('gname').value='';$('gq').value='50k';$('gerr').textContent='';$('modal').classList.remove('hide');$('gname').focus()};
$('gcancel').onclick=()=>$('modal').classList.add('hide');
$('gok').onclick=()=>{
  const n=$('gname').value.trim().replace(/\s+/g,' '),q=parse($('gq').value),e=$('gerr');
  if(!n){e.textContent='Type the game name.';return}
  if(!(q>0)){e.textContent='Quota must be a number like 50k.';return}
  if(Object.values(S.games).some(g=>g.name.toLowerCase()===n.toLowerCase())){e.textContent='You already have that game.';return}
  if(Object.keys(S.games).length>=20){e.textContent='Limit is 20 games.';return}
  const id='g'+Date.now().toString(36);
  S.games[id]={name:n,quota:q,items:[],days:{}};
  $('modal').classList.add('hide');selectGame(id);
};
const MAXITEMS=50;
function renderItems(keep){
  const it=G.items||[],sl=$('axe');
  const v=keep!==undefined?keep:sl.value;
  sl.innerHTML=it.length?it.map(n=>'<option>'+esc(n)+'</option>').join(''):'<option value="">Add an item below</option>';
  if(it.includes(v))sl.value=v;
}
$('additem').onclick=()=>{
  const n=$('newitem').value.trim().replace(/\s+/g,' '),m=$('itemmsg');
  if(!n){m.textContent='Type a name first.';return}
  if((G.items||[]).some(x=>x.toLowerCase()===n.toLowerCase())){m.textContent='That item is already in your list.';return}
  if((G.items||[]).length>=MAXITEMS){m.textContent='List is full ('+MAXITEMS+' items). Remove one first.';return}
  G.items=(G.items||[]).concat(n);$('newitem').value='';m.textContent='Added "'+n+'".';
  renderItems(n);save();
};
$('newitem').onkeydown=e=>{if(e.key==='Enter')$('additem').click()};
$('delitem').onclick=e=>{e.preventDefault();const v=$('axe').value;if(!v)return;G.items=G.items.filter(x=>x!==v);$('itemmsg').textContent='Removed "'+v+'" (past sales keep the name).';renderItems('');save()};
$('sell').onclick=()=>{
  if(!$('axe').value){$('itemmsg').textContent='Add an item first.';$('newitem').focus();return}
  const p=parse($('pr').value);
  if(!(p>0)){$('pr').focus();$('pr').style.borderColor='var(--r)';return}
  $('pr').style.borderColor='';
  const d=G.days[cur]||(G.days[cur]={sales:[],gaveUp:null,q:G.quota});
  let t=Date.now();
  if(cur!==key(new Date()))t=new Date(cur+'T12:00:00').getTime();
  d.sales.push({t,axe:$('axe').value,price:p});
  $('pr').value='';save();renderSell();
};
$('give').onclick=()=>{
  const d=get(cur);
  if(d.gaveUp){d.gaveUp=null;G.days[cur]=d;save();renderSell();return}
  if(!armed){armed=1;$('give').textContent='Tap again to confirm give up';setTimeout(()=>{armed=0;renderSell()},4000);return}
  armed=0;if(!d.q)d.q=G.quota;d.gaveUp=Date.now();G.days[cur]=d;save();renderSell();
};
$('qsave').onclick=()=>{
  const v=parse($('qin').value);
  if(!(v>0)){$('qin').style.borderColor='var(--r)';return}
  $('qin').style.borderColor='';G.quota=v;
  const d=G.days[cur];if(d)d.q=v;
  save();renderSell();renderTrack();
};
window.undo=i=>{const d=get(cur);d.sales.splice(i,1);save();renderSell()};

function renderSell(){
  const d=get(cur),t=sum(d),Q=qOf(d),pct=Math.min(100,t/Q*100);
  $('tot').textContent=f(t);$('qv').textContent=f(Q);
  if(document.activeElement!==$('qin'))$('qin').value=G.quota;
  $('pb').style.width=pct+'%';$('pb').className=t>=Q?'ok':'';
  $('msg').textContent=d.gaveUp?'Gave up at '+tm(d.gaveUp)+' with '+f(t)+' sold.':t>=Q?'🎉 Quota hit! Extra: '+f(t-Q):f(Q-t)+' left to hit quota';
  $('sell').disabled=!!d.gaveUp;
  $('give').textContent=d.gaveUp?'Reopen this day':'Give up for the day';
  $('log').innerHTML=d.sales.length?d.sales.map((s,i)=>'<div class="row"><span>'+tm(s.t)+' · '+esc(s.axe)+'</span><span><b>'+f(s.price)+'</b> <a href="#" onclick="undo('+i+');return false" style="color:var(--r)">✕</a></span></div>').reverse().join(''):'<div class="mu" style="margin-top:6px">Nothing sold yet.</div>';
}

function status(k){const d=get(k),t=sum(d);return t>=qOf(d)?'g':t>0?'y':'r'}
function renderTrack(){
  const keys=Object.keys(G.days).filter(k=>G.days[k].sales.length||G.days[k].gaveUp).sort();
  const today=key(new Date());
  let start=keys.length?keys[0]:today;if(start>today)start=today;
  const out=[];const end=new Date(today+'T12:00:00');
  for(let d=new Date(start+'T12:00:00');d<=end;d.setDate(d.getDate()+1))out.push(key(d));
  for(const k of keys)if(!out.includes(k))out.push(k);
  out.sort();
  let life=0,cnt=0,hit=0;
  for(const k of out){const d=get(k);life+=sum(d);cnt+=d.sales.length;if(sum(d)>=qOf(d))hit++}
  $('life').textContent=f(life);$('cnt').textContent=f(cnt);$('hit').textContent=hit;$('dd').textContent=out.length;
  $('grid').innerHTML=out.map(k=>{const[y,m,dd]=k.split('-');return '<button class="box '+status(k)+(k===sel?' sel':'')+'" data-k="'+k+'">'+dd+'/'+m+'</button>'}).join('');
  $('grid').querySelectorAll('.box').forEach(b=>b.onclick=()=>{sel=b.dataset.k;renderTrack()});
  const el=$('det');
  if(!sel){el.classList.add('hide');return}
  const d=get(sel),t=sum(d),h=hitInfo(d),Q=qOf(d);
  el.classList.remove('hide');
  let html='<b>'+nice(sel)+'</b> <span class="mu">('+(status(sel)==='g'?'Quota hit':status(sel)==='y'?'Quota not hit':'No items sold')+')</span>';
  html+='<div class="row"><span>Total sold</span><b>'+f(t)+' / '+f(Q)+'</b></div>';
  html+='<div class="row"><span>Items sold</span><b>'+d.sales.length+'</b></div>';
  if(d.sales.length)html+='<div class="row"><span>First / last sale</span><b>'+tm(d.sales[0].t)+' / '+tm(d.sales[d.sales.length-1].t)+'</b></div>';
  if(h)html+='<div class="row"><span>Quota hit at</span><b>'+tm(h.t)+'</b></div><div class="row"><span>Time taken to hit quota</span><b>'+dur(h.took)+'</b></div>';
  else if(d.sales.length)html+='<div class="row"><span>Short by</span><b>'+f(Q-t)+'</b></div>';
  if(d.gaveUp)html+='<div class="row"><span>Gave up at</span><b>'+tm(d.gaveUp)+'</b></div>';
  html+=d.sales.map(s=>'<div class="row"><span>'+tm(s.t)+' · '+esc(s.axe)+'</span><b>'+f(s.price)+'</b></div>').join('');
  el.innerHTML=html;
}
</script>
</body>
</html>
